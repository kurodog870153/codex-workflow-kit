name: Work Rust Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust-windows:
    name: rust-windows (${{ matrix.target }})
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - x86_64-pc-windows-gnu
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      WORK_RUST_TARGET: ${{ matrix.target }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
      - name: Verify checkout preserves repository line endings
        working-directory: .
        run: |
          $paths = @(
            'README.md',
            'skills/work/SKILL.md',
            'rust/crates/work-infrastructure/fixtures/cases/discussion/assembly/valid/project/outputs/work/sources/example/SRC-001/source.txt'
          )
          foreach ($path in $paths) {
            $entry = git ls-files --eol -- $path
            if ($entry -notmatch '^i/lf\s+w/lf\s') {
              throw "Checkout changed line endings for ${path}: $entry"
            }
          }
          $batchPaths = @(
            'os-scripts/windows/clean-codex-data.bat',
            'os-scripts/windows/install-global-agents.bat',
            'os-scripts/windows/install-work.bat'
          )
          foreach ($path in $batchPaths) {
            $entry = git ls-files --eol -- $path
            if ($entry -notmatch '^i/lf\s+w/crlf\s') {
              throw "Checkout changed batch line endings for ${path}: $entry"
            }
          }
      - name: Test CI performance reporter
        run: python -m unittest discover -s ../.github/scripts -p test_ci_perf.py
      - name: Set up Rust 1.85 toolchain
        run: |
          rustup toolchain install 1.85.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup component add clippy rustfmt --toolchain 1.85.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add $env:WORK_RUST_TARGET --toolchain 1.85.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:WORK_RUST_TARGET -eq 'x86_64-pc-windows-gnu') {
            $gcc = (Get-Command gcc -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
            $machine = & $gcc -dumpmachine
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($machine.Trim() -ne 'x86_64-w64-mingw32') {
              throw "Expected a Windows x86_64 MinGW linker, found ${machine}: $gcc"
            }
            "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$gcc" | Out-File -FilePath $env:GITHUB_ENV -Append
            Split-Path -Parent $gcc | Out-File -FilePath $env:GITHUB_PATH -Append
            & $gcc --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148
          fallback: none
      - name: Record runner environment
        run: |
          "Runner: $env:RUNNER_OS / $env:RUNNER_ARCH" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Rust target: $env:WORK_RUST_TARGET" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Checkout commit: $commit" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check all Rust targets
        run: cargo check --workspace --all-targets --locked --target $env:WORK_RUST_TARGET
      - name: Check Rust lints
        run: cargo clippy --workspace --all-targets --all-features --locked --target $env:WORK_RUST_TARGET -- -D warnings
      - name: Compile Rust tests
        id: test_compile
        continue-on-error: true
        run: python ../.github/scripts/ci_perf.py measure --directory .ci-perf --phase compile -- cargo test --workspace --locked --no-run --target $env:WORK_RUST_TARGET
      - name: Run Rust unit and integration tests
        if: steps.test_compile.outcome == 'success'
        continue-on-error: true
        run: python ../.github/scripts/ci_perf.py measure --directory .ci-perf --phase test -- cargo nextest run --workspace --locked --profile ci --no-fail-fast --target $env:WORK_RUST_TARGET
      - name: Run Rust doc tests
        if: steps.test_compile.outcome == 'success'
        continue-on-error: true
        run: python ../.github/scripts/ci_perf.py measure --directory .ci-perf --phase doc -- cargo test --workspace --locked --doc --target $env:WORK_RUST_TARGET
      - name: Report Rust performance
        if: always()
        run: python ../.github/scripts/ci_perf.py report --directory .ci-perf --junit target/nextest/ci/junit.xml --output .ci-perf/performance.json --platform windows --target $env:WORK_RUST_TARGET
      - name: Upload Rust performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-perf-${{ matrix.target }}
          path: |
            rust/.ci-perf/
            rust/target/nextest/ci/junit.xml
          retention-days: 90
          if-no-files-found: warn
      - name: Compare with main history
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python ../.github/scripts/ci_perf.py compare --report .ci-perf/performance.json --workflow work-rust-windows.yml --artifact rust-perf-$env:WORK_RUST_TARGET
      - name: Enforce Rust test results
        if: always()
        run: python ../.github/scripts/ci_perf.py enforce --directory .ci-perf --junit target/nextest/ci/junit.xml
      - name: Build Work release binary
        run: cargo build --release --locked -p work-cli --target $env:WORK_RUST_TARGET
      - name: Smoke test Rust binary
        run: '& ".\target\$env:WORK_RUST_TARGET\release\work.exe" --help'
