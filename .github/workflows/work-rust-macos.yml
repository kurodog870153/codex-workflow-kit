name: Work Rust macOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust-macos:
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify checkout preserves repository line endings
        working-directory: .
        run: |
          for path in README.md skills/work/SKILL.md rust/crates/work-infrastructure/fixtures/cases/discussion/assembly/valid/project/outputs/work/sources/example/SRC-001/source.txt; do
            entry="$(git ls-files --eol -- "$path")"
            [[ "$entry" =~ ^i/lf[[:space:]]+w/lf[[:space:]] ]] || { echo "Checkout changed line endings: $entry"; exit 1; }
          done
          for path in os-scripts/windows/clean-codex-data.bat os-scripts/windows/install-global-agents.bat os-scripts/windows/install-work.bat; do
            entry="$(git ls-files --eol -- "$path")"
            [[ "$entry" =~ ^i/lf[[:space:]]+w/crlf[[:space:]] ]] || { echo "Checkout changed batch line endings: $entry"; exit 1; }
          done
      - name: Test CI performance reporter
        run: python3 -m unittest discover -s ../.github/scripts -p test_ci_perf.py
      - name: Install Rust 1.85 components
        run: |
          rustup toolchain install 1.85.0
          rustup component add clippy rustfmt --toolchain 1.85.0
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148
          fallback: none
      - name: Record runner environment
        run: |
          commit="$(git rev-parse HEAD)"
          {
            echo '## Work Rust macOS runner'
            echo "Checkout commit: $commit"
            echo "Runner: $RUNNER_OS / $RUNNER_ARCH / ${ImageOS:-unknown}"
            sw_vers
            uname -m
            rustc --version
            cargo --version
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check all Rust targets
        run: cargo check --workspace --all-targets --locked
      - name: Check Rust lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Compile Rust tests
        id: test_compile
        continue-on-error: true
        run: python3 ../.github/scripts/ci_perf.py measure --directory .ci-perf --phase compile -- cargo test --workspace --locked --no-run
      - name: Run Rust unit and integration tests
        if: steps.test_compile.outcome == 'success'
        continue-on-error: true
        run: python3 ../.github/scripts/ci_perf.py measure --directory .ci-perf --phase test -- cargo nextest run --workspace --locked --profile ci --no-fail-fast
      - name: Run Rust doc tests
        if: steps.test_compile.outcome == 'success'
        continue-on-error: true
        run: python3 ../.github/scripts/ci_perf.py measure --directory .ci-perf --phase doc -- cargo test --workspace --locked --doc
      - name: Report Rust performance
        if: always()
        run: python3 ../.github/scripts/ci_perf.py report --directory .ci-perf --junit target/nextest/ci/junit.xml --output .ci-perf/performance.json --platform macos --target native
      - name: Upload Rust performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-perf-macos
          path: |
            rust/.ci-perf/
            rust/target/nextest/ci/junit.xml
          retention-days: 90
          if-no-files-found: warn
          include-hidden-files: true
      - name: Compare with main history
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ../.github/scripts/ci_perf.py compare --report .ci-perf/performance.json --workflow work-rust-macos.yml --artifact rust-perf-macos
      - name: Enforce Rust test results
        if: always()
        run: python3 ../.github/scripts/ci_perf.py enforce --directory .ci-perf --junit target/nextest/ci/junit.xml
      - name: Build Work release binary
        run: cargo build --release --locked -p work-cli
      - name: Smoke test Rust binary
        run: target/release/work --help
