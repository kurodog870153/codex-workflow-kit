name: Work Rust macOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust-macos:
    runs-on: macos-latest
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout preserves repository line endings
        working-directory: .
        run: |
          for path in README.md skills/work/SKILL.md rust/crates/work-infrastructure/fixtures/task-draft-sources/valid/outputs/work/sources/example/SRC-001/source.txt; do
            entry="$(git ls-files --eol -- "$path")"
            [[ "$entry" =~ ^i/lf[[:space:]]+w/lf[[:space:]] ]] || { echo "Checkout changed line endings: $entry"; exit 1; }
          done
          for path in os-scripts/windows/clean-codex-data.bat os-scripts/windows/install-global-agents.bat os-scripts/windows/install-work.bat; do
            entry="$(git ls-files --eol -- "$path")"
            [[ "$entry" =~ ^i/lf[[:space:]]+w/crlf[[:space:]] ]] || { echo "Checkout changed batch line endings: $entry"; exit 1; }
          done
      - name: Install Rust 1.85 components
        run: |
          rustup toolchain install 1.85.0
          rustup component add clippy rustfmt --toolchain 1.85.0
      - name: Record runner environment
        run: |
          commit="$(git rev-parse HEAD)"
          {
            echo '## Work Rust macOS runner'
            echo "Checkout commit: $commit"
            echo "Runner: $RUNNER_OS / $RUNNER_ARCH / ${ImageOS:-unknown}"
            sw_vers
            uname -m
            rustc --version
            cargo --version
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check all Rust targets
        run: cargo check --workspace --all-targets --locked
      - name: Check Rust lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Build Work release binary
        run: cargo build --release --locked -p work-cli
      - name: Smoke test Rust binary
        run: target/release/work --help
